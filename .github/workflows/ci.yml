name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: wyvox/action@v1
      - run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: wyvox/action@v1
      - run: pnpm test

  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: wyvox/action@v1
      - run: pnpm test:bundle

  trial-apps:
    name: List trial apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "apps=$(node --input-type=module -e 'import { apps } from "./trials/apps.js"; console.log(JSON.stringify(apps.map((a) => a.name)))')" >> "$GITHUB_OUTPUT"

  trials:
    name: Trial (${{ matrix.app }})
    needs: trial-apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.trial-apps.outputs.apps) }}
    steps:
      - uses: wyvox/action@v1
      - run: pnpm build
      - run: node scripts/trial.js ${{ matrix.app }}
